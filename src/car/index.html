<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小车拍一拍 - 亲子小游戏</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="toddler-shell">
    <header class="hero">
      <h1>小车拍一拍</h1>
      <p>看到哪辆车，就点哪辆。</p>
      <p class="hero-note">一起点一点就行，点错也没关系。</p>
      <div class="hero-links">
        <a href="../../index.html">返回首页</a> | <a href="../animal/index.html">动物叫叫乐</a>
      </div>
    </header>

    <section class="play-stage">
      <section class="prompt-card">
        <strong>找这辆</strong>
        <div id="targetBadge" class="target-badge" aria-live="polite"></div>
        <p id="guideText" class="guide-text">点大卡片。</p>
        <div class="control-row">
          <button id="nextBtn" type="button">换一辆</button>
          <button id="resetBtn" type="button">重新来</button>
        </div>
      </section>

      <section class="board-panel">
        <div id="celebration" class="celebration" aria-live="polite"></div>
        <div class="stats" aria-live="polite">
          <div><span>贴纸</span><strong id="stickersValue">0</strong></div>
          <div><span>点按</span><strong id="tapsValue">0</strong></div>
          <div><span>最好</span><strong id="bestValue">0</strong></div>
        </div>
        <div id="board" class="board" aria-label="小车卡片区"></div>
        <p id="feedback" class="feedback" aria-live="polite"></p>
      </section>
    </section>

    <section class="support-strip">
      <button id="statsToggleBtn" type="button">家长查看</button>
      <button id="voiceBtn" type="button">语音引导：开</button>
      <button id="parentModeBtn" type="button">护眼模式：标准</button>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
