<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>动物叫叫乐 - 亲子小游戏</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="toddler-shell">
    <header class="hero">
      <h1>动物叫叫乐</h1>
      <p>找一找是哪只小动物。</p>
      <p class="hero-note">点一点击就行，可以一起学叫声。</p>
      <div class="hero-links">
        <a href="../../index.html">返回首页</a> | <a href="../balloon/index.html">气球点点乐</a>
      </div>
    </header>

    <section class="play-stage">
      <section class="prompt-card">
        <strong>找这只</strong>
        <div id="targetBadge" class="target-badge" aria-live="polite"></div>
        <p id="guideText" class="guide-text">点这只就行。</p>
        <div class="control-row">
          <button id="nextBtn" type="button">换一只</button>
          <button id="resetBtn" type="button">重新来</button>
        </div>
      </section>

      <section class="board-panel">
        <div id="celebration" class="celebration" aria-live="polite"></div>
        <div class="stats" aria-live="polite">
          <div><span>找到</span><strong id="foundValue">0</strong></div>
          <div><span>点按</span><strong id="tapsValue">0</strong></div>
          <div><span>最好</span><strong id="bestValue">0</strong></div>
        </div>
        <div id="board" class="board" aria-label="动物卡片区"></div>
        <p id="feedback" class="feedback" aria-live="polite"></p>
      </section>
    </section>

    <section class="support-strip">
      <button id="statsToggleBtn" type="button">家长查看</button>
      <button id="voiceBtn" type="button">语音引导：开</button>
      <button id="parentModeBtn" type="button">护眼模式：标准</button>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
