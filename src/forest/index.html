<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>森林巡护员 - 儿童小游戏</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="forest-shell">
    <header class="hero">
      <h1>森林巡护员</h1>
      <p id="guideText">看清森林线索，把它送到对应观察站。</p>
      <div class="hero-links">
        <a href="../../index.html">返回首页</a> | <a href="../chef/index.html">小小厨师配餐</a>
      </div>
    </header>

    <section class="play-stage">
      <section class="selector-panel">
        <strong>巡护难度</strong>
        <div id="levelButtons" class="level-buttons"></div>
        <strong>主题林区</strong>
        <div id="themeButtons" class="theme-buttons"></div>
        <div class="selector-actions">
          <button id="startBtn" type="button">开始巡护</button>
          <button id="retryBtn" type="button">重新巡护</button>
          <button id="dailyBtn" type="button">今日林线</button>
        </div>
        <p id="selectorHint">先选难度，再开始巡护。</p>
      </section>

      <section class="game-panel">
        <section class="stats" aria-live="polite">
          <div><span>已识别</span><strong id="progressValue">0 / 0</strong></div>
          <div><span>时间</span><strong id="timeValue">0 秒</strong></div>
          <div><span>体力</span><strong id="livesValue">0</strong></div>
          <div><span>分数</span><strong id="scoreValue">0</strong></div>
          <div><span>连对</span><strong id="streakValue">0</strong></div>
          <div><span>最佳</span><strong id="bestValue">0</strong></div>
        </section>

        <section class="patrol-panel">
          <div class="panel-head">
            <strong>当前线索</strong>
            <span id="weatherText">天气：晴光</span>
            <span id="feedbackText">准备好后开始巡护。</span>
          </div>

          <section class="active-clue">
            <div class="clue-top">
              <strong id="clueLabel">等待线索...</strong>
              <span id="clueEmoji">🐾</span>
            </div>
            <span id="clueTypeBadge" class="badge normal">待识别</span>
            <p id="clueHint">请选择对应线索的观察站。</p>
          </section>

          <section class="station-panel">
            <strong>观察站区域</strong>
            <div id="stationButtons" class="station-buttons"></div>
          </section>

          <section class="queue-panel">
            <strong>后续线索</strong>
            <div id="queueList" class="queue-list"></div>
          </section>
        </section>
      </section>
    </section>

    <section class="support-strip">
      <button id="voiceBtn" type="button">语音引导：开</button>
      <button id="narrationBtn" type="button">播报模式：关键</button>
      <button id="parentModeBtn" type="button">护眼模式：标准</button>
    </section>

    <section class="result" id="result" hidden>
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
