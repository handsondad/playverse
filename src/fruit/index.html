<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>果园分拣员 - 儿童小游戏</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="fruit-shell">
    <header class="hero">
      <h1>果园分拣员</h1>
      <p id="guideText">看清水果颜色，把它放进同色果篮。</p>
      <div class="hero-links">
        <a href="../../index.html">返回首页</a> | <a href="../pet/index.html">小小宠物诊所</a>
      </div>
    </header>

    <section class="play-stage">
      <section class="selector-panel">
        <strong>分拣难度</strong>
        <div id="levelButtons" class="level-buttons"></div>
        <strong class="theme-title">果园主题</strong>
        <div id="themeButtons" class="theme-buttons"></div>
        <strong class="action-title">开始操作</strong>
        <div class="selector-actions">
          <button id="startBtn" type="button">开始分拣</button>
          <button id="retryBtn" type="button">重新分拣</button>
          <button id="dailyBtn" type="button">今日果园</button>
        </div>
        <p id="selectorHint">先选难度，再开始分拣。</p>
      </section>

      <section class="game-panel">
        <section class="stats" aria-live="polite">
          <div><span>已分拣</span><strong id="progressValue">0 / 0</strong></div>
          <div><span>时间</span><strong id="timeValue">0 秒</strong></div>
          <div><span>生命</span><strong id="livesValue">0</strong></div>
          <div><span>分数</span><strong id="scoreValue">0</strong></div>
          <div><span>连对</span><strong id="streakValue">0</strong></div>
          <div><span>最佳</span><strong id="bestValue">0</strong></div>
        </section>

        <section class="delivery-panel">
          <div class="panel-head">
            <strong>当前水果</strong>
            <span id="weatherText">天气：晴天</span>
          </div>
          <p id="feedbackText">准备好后开始分拣。</p>

          <section class="active-fruit">
            <div class="fruit-top">
              <strong id="fruitLabel">等待水果...</strong>
              <span class="fruit-meta"><span id="fruitTypeBadge" class="badge normal">待分拣</span><span id="fruitEmoji">🍎</span></span>
            </div>
            <p id="fruitHint">请选择对应颜色的果篮。</p>
          </section>

          <section class="basket-panel">
            <strong>果篮区域</strong>
            <div id="basketButtons" class="basket-buttons"></div>
          </section>

          <section class="queue-panel">
            <strong>后续水果</strong>
            <div id="queueList" class="queue-list"></div>
          </section>
        </section>
      </section>
    </section>

    <section class="support-strip">
      <button id="voiceBtn" type="button">语音引导：开</button>
      <button id="narrationBtn" type="button">播报模式：关键</button>
      <button id="parentModeBtn" type="button">护眼模式：标准</button>
    </section>

    <section class="result" id="result" hidden>
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
