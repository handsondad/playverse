<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>天气穿搭屋 - 儿童小游戏</title>
  <link rel="stylesheet" href="../shared/base.css" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" href="../../icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="../../icons/icon-192.png" />
  <link rel="manifest" href="../../manifest.webmanifest" />
  <meta name="theme-color" content="#66a2df" />
  <script type="module" src="../../src/shared/pwa.js"></script>
</head>
<body>
  <main class="weatherwear-shell">
    <header class="hero">
      <h1>天气穿搭屋</h1>
      <p id="guideText" role="status">看看窗外是什么天气和温度，帮小朋友挑对合适的衣物出门。</p>
      <div class="hero-links">
        <a href="../../index.html">返回首页</a> | <a href="../chef/index.html">小小厨师配餐</a>
      </div>
    </header>

    <section class="play-stage">
      <section class="selector-panel">
        <strong>穿搭难度</strong>
        <div id="levelButtons" class="level-buttons"></div>

        <strong class="action-title">开始操作</strong>
        <div class="selector-actions">
          <button id="startBtn" type="button">开始穿搭</button>
          <button id="retryBtn" type="button">重新开始</button>
          <button id="dailyBtn" type="button">今日穿搭</button>
        </div>
        <p id="selectorHint">先选穿搭难度，再点开始穿搭。</p>
      </section>

      <section class="game-panel">
        <div class="stats">
          <div><span>行程</span><strong id="roundsValue">0 / 0</strong></div>
          <div><span>分数</span><strong id="scoreValue">0</strong></div>
          <div><span>连对</span><strong id="streakValue">0</strong></div>
          <div><span>提示</span><strong id="hintsValue">0</strong></div>
          <div><span>最佳</span><strong id="bestValue">0</strong></div>
        </div>

        <section class="wardrobe-stage">
          <div class="window-card">
            <div class="window-weather">
              <span id="weatherIcon" class="weather-icon">☀️</span>
              <div>
                <strong id="weatherTitle">等待拉开窗帘</strong>
                <p id="activityText">点「开始穿搭」看看今天去哪儿玩</p>
              </div>
            </div>
            <button id="hintBtn" type="button">穿搭提示</button>
          </div>

          <p id="feedbackText" role="status">选好难度，点开始帮小朋友准备出门穿搭吧。</p>

          <section class="bag-panel">
            <div class="bag-head">
              <strong>出门小衣筐（<span id="bagCount">0 / 0</span>）</strong>
              <div class="bag-actions">
                <button id="clearBtn" type="button">清空重选</button>
                <button id="submitBtn" type="button">准备出门</button>
              </div>
            </div>
            <div id="bagSlots" class="bag-slots" aria-label="已选穿戴槽位"></div>
          </section>

          <section class="shelf-panel">
            <strong>小衣柜与装备架（点一下穿上或放回）</strong>
            <div id="shelfGrid" class="shelf-grid" aria-label="衣柜候选物品区"></div>
          </section>
        </section>
      </section>
    </section>

    <section class="support-strip">
      <button id="voiceBtn" type="button">语音引导：开</button>
      <button id="narrationBtn" type="button">播报模式：关键</button>
      <button id="parentModeBtn" type="button">护眼模式：标准</button>
    </section>

    <section class="result" id="result" hidden>
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
