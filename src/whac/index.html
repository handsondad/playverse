<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>打地鼠升级版 - 儿童小游戏</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="whac-shell">
    <header class="hero">
      <h1>打地鼠升级版</h1>
      <p id="guideText">触屏或鼠标都可以点，先选难度，再开始游戏，优先点小动物。</p>
      <p id="playDurationHint" class="hero-note">建议每次游玩 8-10 分钟，结束后做眼保健活动。</p>
      <div class="hero-links">
        <a href="../../index.html">返回首页</a> | <a href="../lighthouse/index.html">灯塔守护者</a>
      </div>
    </header>

    <section class="play-stage">
      <section class="chapter-panel hero-choice" aria-label="章节地图">
        <strong>难度</strong>
        <div class="chapter-buttons">
          <button id="chapterEasyBtn" data-level-id="easy">慢慢来</button>
          <button id="chapterNormalBtn" data-level-id="normal">刚刚好</button>
          <button id="chapterHardBtn" data-level-id="hard">挑战王</button>
        </div>
        <p id="chapterHint">先点一个难度，再开始游戏。</p>
      </section>

      <section class="game-panel">
        <div class="primary-actions" aria-label="核心操作">
          <button id="startBtn">开始游戏</button>
          <button id="freezeBtn">冻结（1）</button>
          <button id="doubleBtn">双倍分（1）</button>
        </div>

        <section class="stats" aria-live="polite">
          <div><span>时间</span><strong id="timeValue">0</strong></div>
          <div><span>分数</span><strong id="scoreValue">0</strong></div>
          <div><span>连击</span><strong id="comboValue">0</strong></div>
          <div><span>命中</span><strong id="hitValue">0</strong></div>
          <div><span>误点</span><strong id="missValue">0</strong></div>
          <div><span>最好</span><strong id="bestValue">--</strong></div>
        </section>

        <section id="arena" class="arena" aria-label="游戏区域"></section>
      </section>
    </section>

    <section class="support-strip">
      <section class="secondary-actions" aria-label="附加功能">
        <strong>更多功能</strong>
        <div class="secondary-actions-grid">
          <button id="dailyBtn">今日挑战</button>
          <button id="voiceBtn">语音引导：开</button>
          <button id="narrationBtn">播报模式：关键</button>
          <button id="parentModeBtn">护眼模式：标准</button>
        </div>
      </section>

      <section class="meta-stats muted-panel" aria-live="polite">
        <strong>数据统计</strong>
        <div class="meta-grid">
          <div><span>总局数</span><strong id="metaPlays">0</strong></div>
          <div><span>胜率</span><strong id="metaWinRate">0%</strong></div>
          <div><span>平均命中</span><strong id="metaAvgHits">0</strong></div>
          <div><span>平均误点</span><strong id="metaAvgMisses">0</strong></div>
          <div><span>最佳连击</span><strong id="metaBestCombo">0</strong></div>
        </div>
      </section>
    </section>

    <section id="restReminder" class="rest-reminder" hidden aria-live="polite">
      <h2>休息提醒</h2>
      <p id="restReminderText">你已经玩了一会儿啦，休息一下眼睛更舒服。</p>
      <div class="rest-actions">
        <button id="restNowBtn">休息一下</button>
        <button id="restContinueBtn">继续 5 分钟</button>
      </div>
    </section>

    <section class="result" id="result" hidden>
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
      <button id="retryBtn">再来一局</button>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
