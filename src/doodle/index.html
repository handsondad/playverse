<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>涂鸦互动动画 - 儿童小游戏</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="doodle-shell">
    <header class="hero">
      <h1>涂鸦互动动画</h1>
      <p id="guideText">先画一画，再选动作模板，点击播放就能看到作品动起来。</p>
      <div class="hero-links">
        <a href="../../index.html">返回首页</a> | <a href="../choir/index.html">动物合唱团</a>
      </div>
    </header>

    <section class="play-stage">
      <section class="tool-panel">
        <strong>创作工具</strong>
        <div class="tool-row">
          <button id="penBtn" class="is-active" type="button">画笔</button>
          <button id="eraserBtn" type="button">橡皮</button>
          <button id="undoBtn" type="button">撤销</button>
          <button id="clearBtn" type="button">清空</button>
        </div>

        <label class="size-row" for="sizeRange">笔触粗细</label>
        <input id="sizeRange" type="range" min="2" max="26" value="8" />

        <div class="color-row" id="colorRow">
          <button class="color-btn is-active" data-color="#1f78ff" style="--c:#1f78ff" type="button"></button>
          <button class="color-btn" data-color="#ff6f3c" style="--c:#ff6f3c" type="button"></button>
          <button class="color-btn" data-color="#31b86c" style="--c:#31b86c" type="button"></button>
          <button class="color-btn" data-color="#f4b330" style="--c:#f4b330" type="button"></button>
          <button class="color-btn" data-color="#8f63ff" style="--c:#8f63ff" type="button"></button>
          <button class="color-btn" data-color="#2c2f36" style="--c:#2c2f36" type="button"></button>
        </div>

        <strong>动作模板</strong>
        <div id="templateButtons" class="template-buttons"></div>
        <p id="templateHint">选择一个动作后点击播放，涂鸦会按模板动起来。</p>

        <div class="action-row">
          <button id="playBtn" type="button">播放动画</button>
          <button id="stopBtn" type="button">停止</button>
        </div>

        <section class="record-panel">
          <strong>角色配音（3-10 秒）</strong>
          <div class="record-row">
            <button id="recordBtn" type="button">开始录音</button>
            <button id="stopRecordBtn" type="button">结束录音</button>
            <button id="playVoiceBtn" type="button">试听配音</button>
            <button id="clearVoiceBtn" type="button">清除配音</button>
          </div>
          <p id="recordStatus">还没有配音。点击“开始录音”即可录制。</p>
        </section>

        <section class="works-panel">
          <div class="works-head">
            <strong>作品库</strong>
            <button id="saveWorkBtn" type="button">保存当前作品</button>
          </div>
          <p id="worksStatus">还没有保存的作品，画完后点击保存即可。</p>
          <div id="worksList" class="works-list"></div>
          <div class="export-row">
            <button id="exportCardBtn" type="button">导出分享图卡</button>
            <button id="exportClipBtn" type="button">导出短动图</button>
            <span id="exportStatus">导出为 PNG 图片，可发送给家人朋友。</span>
          </div>
        </section>
      </section>

      <section class="canvas-panel">
        <div class="canvas-head">
          <strong>创作画布</strong>
          <span id="drawStats">笔画 0 条</span>
        </div>
        <canvas id="drawCanvas" width="720" height="420" aria-label="创作画布"></canvas>

        <div class="canvas-head preview-head">
          <strong>播放预览</strong>
          <span id="previewState">等待播放</span>
        </div>
        <canvas id="previewCanvas" width="720" height="320" aria-label="动画预览"></canvas>
      </section>
    </section>

    <section class="support-strip">
      <button id="voiceBtn" type="button">语音引导：开</button>
      <button id="narrationBtn" type="button">播报模式：关键</button>
      <button id="parentModeBtn" type="button">护眼模式：标准</button>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
