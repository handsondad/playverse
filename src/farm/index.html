<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>迷你农场小镇 - 儿童小游戏</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="farm-shell">
    <header class="hero">
      <h1>迷你农场小镇</h1>
      <p id="guideText">先选种子，再点地块种下，成熟后收获并完成订单。</p>
      <p id="playDurationHint" class="hero-note">建议每次游玩 6-12 分钟，体验轻松经营循环。</p>
      <div class="weather-strip" aria-live="polite">
        <strong id="weatherBadge">☀️ 晴天</strong>
        <span id="weatherHint">作物长得更快，适合快速补订单。</span>
      </div>
      <div class="hero-links">
        <a href="../../index.html">返回首页</a> | <a href="../ocean/index.html">海底清洁队</a>
      </div>
    </header>

    <section class="play-stage">
      <section class="seed-panel" aria-label="种子选择">
        <strong>当前种子</strong>
        <div class="seed-buttons" id="seedButtons"></div>
        <p id="seedHint">先选种子，再去下方地块种植。</p>
      </section>

      <section class="game-panel">
        <div class="primary-actions" aria-label="核心操作">
          <button id="startBtn">开始经营</button>
          <button id="retryBtn">再来一天</button>
          <button id="harvestAllBtn">收获全部</button>
          <button id="deliverBtn">交付订单</button>
          <button id="fertilizeBtn">施肥（4 金币）</button>
        </div>

        <section class="stats" aria-live="polite">
          <div><span>金币</span><strong id="coinValue">0</strong></div>
          <div><span>经验</span><strong id="xpValue">0</strong></div>
          <div><span>等级</span><strong id="levelValue">1</strong></div>
          <div><span>仓库</span><strong id="bagValue">0</strong></div>
          <div><span>成熟地块</span><strong id="readyValue">0</strong></div>
          <div><span>天数</span><strong id="dayValue">1</strong></div>
          <div><span>平均肥力</span><strong id="soilValue">90</strong></div>
        </section>

        <section class="order-panel" aria-live="polite">
          <strong>今日订单</strong>
          <p id="orderText">请先开始经营。</p>
        </section>

        <section class="mission-panel" aria-live="polite">
          <strong>今日小任务</strong>
          <p id="missionText">请先开始经营。</p>
          <span id="missionReward">奖励：0 金币 + 0 经验</span>
        </section>

        <section class="tutorial-panel" aria-live="polite">
          <strong>新手引导</strong>
          <div class="tutorial-steps" id="tutorialSteps">
            <span class="tutorial-step" data-step="start">1. 开始经营</span>
            <span class="tutorial-step" data-step="plant">2. 先种地</span>
            <span class="tutorial-step" data-step="harvest">3. 收获作物</span>
            <span class="tutorial-step" data-step="deliver">4. 交付订单</span>
            <span class="tutorial-step" data-step="process">5. 用加工台</span>
          </div>
        </section>

        <section class="field" id="field" aria-label="农场地块"></section>

        <section class="processor-panel" aria-live="polite">
          <strong>加工台</strong>
          <p id="processStatus">加工台空闲：可制作沙拉或果汁。</p>
          <div class="recipe-buttons" id="recipeButtons"></div>
        </section>
      </section>
    </section>

    <section class="support-strip">
      <section class="secondary-actions" aria-label="附加功能">
        <strong>更多功能</strong>
        <div class="secondary-actions-grid">
          <button id="dailyBtn">每日挑战</button>
          <button id="voiceBtn">语音引导：开</button>
          <button id="narrationBtn">播报模式：关键</button>
          <button id="parentModeBtn">护眼模式：标准</button>
        </div>
      </section>

      <section class="meta-stats muted-panel" aria-live="polite">
        <strong>经营统计</strong>
        <div class="meta-grid">
          <div><span>总天数</span><strong id="metaDays">0</strong></div>
          <div><span>总收获</span><strong id="metaHarvests">0</strong></div>
          <div><span>完成订单</span><strong id="metaOrders">0</strong></div>
          <div><span>最高等级</span><strong id="metaTopLevel">1</strong></div>
          <div><span>总金币</span><strong id="metaCoins">0</strong></div>
        </div>
      </section>
    </section>

    <section class="result" id="result" hidden>
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
