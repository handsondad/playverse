<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>动物合唱团 - 儿童小游戏</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="choir-shell">
    <header class="hero">
      <h1>动物合唱团</h1>
      <p id="guideText">先听一遍动物合唱顺序，再按同样顺序点出来。</p>
      <div class="hero-links">
        <a href="../../index.html">返回首页</a> | <a href="../star/index.html">星空观测员</a>
      </div>
    </header>

    <section class="play-stage">
      <section class="selector-panel">
        <strong>合唱难度</strong>
        <div id="levelButtons" class="level-buttons"></div>
        <strong class="theme-title">音色主题</strong>
        <div id="themeButtons" class="theme-buttons"></div>
        <div class="selector-actions">
          <button id="startBtn" type="button">开始演奏</button>
          <button id="retryBtn" type="button">重新演奏</button>
          <button id="dailyBtn" type="button">今日合唱</button>
        </div>
        <p id="selectorHint">先选难度，记住顺序再跟唱。</p>

        <section class="hint-panel">
          <button id="hintBtn" type="button">提示一个</button>
          <p id="hintText">提示会告诉你当前该点哪个动物。</p>
        </section>
      </section>

      <section class="game-panel">
        <section class="stats" aria-live="polite">
          <div><span>回合</span><strong id="roundValue">0 / 0</strong></div>
          <div><span>时间</span><strong id="timeValue">0 秒</strong></div>
          <div><span>连对</span><strong id="streakValue">0</strong></div>
          <div><span>最好连对</span><strong id="bestStreakValue">0</strong></div>
          <div><span>阶段</span><strong id="phaseValue">待开始</strong></div>
          <div><span>进度</span><strong id="inputProgressValue">0 / 0</strong></div>
        </section>

        <section class="chorus-panel">
          <div class="panel-head">
            <strong>动物舞台</strong>
            <span id="feedbackText">准备好后点击开始演奏。</span>
          </div>
          <section class="mimic-panel" aria-live="polite">
            <div class="mimic-head">
              <strong>模仿轨迹</strong>
              <span id="perfectComboText">完美连击 0</span>
            </div>
            <div id="mimicTrack" class="mimic-track"></div>
            <p id="rewardHint">连续完美回合会奖励额外时间。</p>
          </section>
          <div id="animalGrid" class="animal-grid"></div>
        </section>
      </section>
    </section>

    <section class="support-strip">
      <button id="voiceBtn" type="button">语音引导：开</button>
      <button id="narrationBtn" type="button">播报模式：关键</button>
      <button id="parentModeBtn" type="button">护眼模式：标准</button>
    </section>

    <section class="result" id="result" hidden>
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
