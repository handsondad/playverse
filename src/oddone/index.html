<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>火眼找不同 - 儿童小游戏</title>
  <link rel="stylesheet" href="../shared/base.css" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" href="../../icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="../../icons/icon-192.png" />
  <link rel="manifest" href="../../manifest.webmanifest" />
  <meta name="theme-color" content="#66a2df" />
  <script type="module" src="../../src/shared/pwa.js"></script>
</head>
<body>
  <main class="oddone-shell">
    <header class="hero">
      <h1>火眼找不同</h1>
      <p id="guideText" role="status">选「眼力找一找」或「逻辑挑不同」，点出唯一不一样的那张卡片。</p>
      <div class="hero-links">
        <a href="../../index.html">返回首页</a> | <a href="../sudoku/index.html">迷你图形数独</a>
      </div>
    </header>

    <section class="play-stage">
      <section class="selector-panel">
        <strong>玩法模式</strong>
        <div id="modeButtons" class="mode-buttons"></div>

        <strong class="level-title">观察难度</strong>
        <div id="levelButtons" class="level-buttons"></div>

        <strong class="action-title">开始操作</strong>
        <div class="selector-actions">
          <button id="startBtn" type="button">开始寻找</button>
          <button id="retryBtn" type="button">重新开始</button>
          <button id="dailyBtn" type="button">今日眼力</button>
        </div>
        <p id="selectorHint">先选模式和难度，再点开始寻找。</p>
      </section>

      <section class="game-panel">
        <div class="stats">
          <div><span>关卡</span><strong id="roundsValue">0 / 0</strong></div>
          <div><span>分数</span><strong id="scoreValue">0</strong></div>
          <div><span>连对</span><strong id="streakValue">0</strong></div>
          <div><span>提示</span><strong id="hintsValue">0</strong></div>
          <div><span>最佳</span><strong id="bestValue">0</strong></div>
        </div>

        <section class="search-stage">
          <div class="stage-head">
            <strong id="promptTitle">准备开始观察吧</strong>
            <button id="hintBtn" type="button">放大镜提示</button>
          </div>
          <p id="feedbackText" role="status">准备好了就点开始吧。</p>
          <div id="cardGrid" class="card-grid" aria-label="找不同卡片网格"></div>
        </section>
      </section>
    </section>

    <section class="support-strip">
      <button id="voiceBtn" type="button">语音引导：开</button>
      <button id="narrationBtn" type="button">播报模式：关键</button>
      <button id="parentModeBtn" type="button">护眼模式：标准</button>
    </section>

    <section class="result" id="result" hidden>
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
