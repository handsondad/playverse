<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星星藏哪儿 - 儿童小游戏</title>
  <link rel="stylesheet" href="../shared/base.css" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" href="../../icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="../../icons/icon-192.png" />
  <link rel="manifest" href="../../manifest.webmanifest" />
  <meta name="theme-color" content="#66a2df" />
  <script type="module" src="../../src/shared/pwa.js"></script>
</head>
<body>
  <main class="cups-shell">
    <header class="hero">
      <h1>星星藏哪儿</h1>
      <p id="guideText" role="status">看清宝物藏进哪只魔术杯，盯着交换后的位置把它点出来。</p>
      <div class="hero-links">
        <a href="../../index.html">返回首页</a> | <a href="../missing/index.html">桌上少了谁</a>
      </div>
    </header>

    <section class="play-stage">
      <section class="selector-panel">
        <strong>魔术难度</strong>
        <div id="levelButtons" class="level-buttons"></div>

        <strong class="action-title">开始操作</strong>
        <div class="selector-actions">
          <button id="startBtn" type="button">开始变魔术</button>
          <button id="retryBtn" type="button">再来一局</button>
          <button id="dailyBtn" type="button">今日魔术</button>
        </div>
        <p id="selectorHint">先选难度，再点开始变魔术。</p>
      </section>

      <section class="game-panel">
        <div class="stats">
          <div><span>回合</span><strong id="roundsValue">0 / 0</strong></div>
          <div><span>机会</span><strong id="livesValue">0</strong></div>
          <div><span>分数</span><strong id="scoreValue">0</strong></div>
          <div><span>连对</span><strong id="streakValue">0</strong></div>
          <div><span>最佳</span><strong id="bestValue">0</strong></div>
        </div>

        <section class="magic-stage">
          <div class="stage-head">
            <span id="phaseBadge" class="phase-badge">🎩 魔术剧场</span>
            <button id="hintBtn" type="button">排除空杯（0）</button>
          </div>
          <p id="feedbackText" role="status">选好难度，点开始看魔术师藏星星吧。</p>

          <div id="cupStage" class="cup-stage" aria-label="魔术杯舞台"></div>
        </section>
      </section>
    </section>

    <section class="support-strip">
      <button id="voiceBtn" type="button">语音引导：开</button>
      <button id="narrationBtn" type="button">播报模式：关键</button>
      <button id="parentModeBtn" type="button">护眼模式：标准</button>
    </section>

    <section class="result" id="result" hidden>
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
