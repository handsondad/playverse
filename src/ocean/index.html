<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>海底清洁队 - 儿童小游戏</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="ocean-shell">
    <header class="hero">
      <h1>海底清洁队</h1>
      <p id="guideText">看清漂浮物类型，把它放进对应回收网。</p>
      <div class="hero-links">
        <a href="../../index.html">返回首页</a> | <a href="../forest/index.html">森林巡护员</a>
      </div>
    </header>

    <section class="play-stage">
      <section class="selector-panel">
        <strong>清理难度</strong>
        <div id="levelButtons" class="level-buttons"></div>
        <strong class="theme-title">海域主题</strong>
        <div id="themeButtons" class="theme-buttons"></div>
        <strong class="action-title">开始操作</strong>
        <div class="selector-actions">
          <button id="startBtn" type="button">开始清理</button>
          <button id="retryBtn" type="button">重新清理</button>
          <button id="dailyBtn" type="button">今日海域</button>
        </div>
        <p id="selectorHint">先选难度，再开始清理。</p>
      </section>

      <section class="game-panel">
        <section class="stats" aria-live="polite">
          <div><span>已清理</span><strong id="progressValue">0 / 0</strong></div>
          <div><span>时间</span><strong id="timeValue">0 秒</strong></div>
          <div><span>生命</span><strong id="livesValue">0</strong></div>
          <div><span>分数</span><strong id="scoreValue">0</strong></div>
          <div><span>连对</span><strong id="streakValue">0</strong></div>
          <div><span>最佳</span><strong id="bestValue">0</strong></div>
        </section>

        <section class="cleanup-panel">
          <div class="panel-head">
            <strong>当前漂浮物</strong>
            <span id="weatherText">海况：晴海</span>
          </div>
          <p id="feedbackText">准备好后开始清理。</p>

          <section class="active-trash">
            <div class="trash-top">
              <strong id="trashLabel">等待漂浮物...</strong>
              <span class="trash-meta"><span id="trashTypeBadge" class="badge normal">待处理</span><span id="trashEmoji">🧴</span></span>
            </div>
            <p id="trashHint">请选择对应类型的回收网。</p>
          </section>

          <section class="net-panel">
            <strong>回收网区域</strong>
            <div id="netButtons" class="net-buttons"></div>
          </section>

          <section class="queue-panel">
            <strong>后续漂浮物</strong>
            <div id="queueList" class="queue-list"></div>
          </section>
        </section>
      </section>
    </section>

    <section class="support-strip">
      <button id="voiceBtn" type="button">语音引导：开</button>
      <button id="narrationBtn" type="button">播报模式：关键</button>
      <button id="parentModeBtn" type="button">护眼模式：标准</button>
    </section>

    <section class="result" id="result" hidden>
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
