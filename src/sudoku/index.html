<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>迷你图形数独 - 儿童小游戏</title>
  <link rel="stylesheet" href="../shared/base.css" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" href="../../icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="../../icons/icon-192.png" />
  <link rel="manifest" href="../../manifest.webmanifest" />
  <meta name="theme-color" content="#66a2df" />
  <script type="module" src="../../src/shared/pwa.js"></script>
</head>
<body>
  <main class="sudoku-shell">
    <header class="hero">
      <h1>迷你图形数独</h1>
      <p id="guideText" role="status">让每一行、每一列和每个小宫格里的图案都不重复。</p>
      <div class="hero-links">
        <a href="../../index.html">返回首页</a> | <a href="../balance/index.html">趣味小天平</a>
      </div>
    </header>

    <section class="play-stage">
      <section class="selector-panel">
        <strong>棋盘难度</strong>
        <div id="levelButtons" class="level-buttons"></div>

        <strong class="theme-title">图案主题</strong>
        <div id="themeButtons" class="theme-buttons"></div>

        <strong class="action-title">开始操作</strong>
        <div class="selector-actions">
          <button id="startBtn" type="button">开始解题</button>
          <button id="retryBtn" type="button">重新开局</button>
          <button id="dailyBtn" type="button">今日数独</button>
        </div>
        <p id="selectorHint">先选棋盘难度和主题，再点开始解题。</p>
      </section>

      <section class="game-panel">
        <div class="stats">
          <div><span>空格剩余</span><strong id="blanksValue">0</strong></div>
          <div><span>步数</span><strong id="movesValue">0</strong></div>
          <div><span>冲突</span><strong id="conflictsValue">0</strong></div>
          <div><span>提示</span><strong id="hintsValue">0</strong></div>
          <div><span>最佳</span><strong id="bestValue">0</strong></div>
        </div>

        <section class="board-stage">
          <div class="stage-head">
            <strong>推理棋盘</strong>
            <div class="tool-actions">
              <button id="eraseBtn" type="button">擦除空格</button>
              <button id="hintBtn" type="button">推理提示</button>
            </div>
          </div>
          <p id="feedbackText" role="status">选好宫格难度和图案主题，点开始挑战。</p>

          <div id="sudokuBoard" class="sudoku-board" aria-label="迷你数独棋盘"></div>

          <section class="palette-panel">
            <strong>点选图案填入选中格</strong>
            <div id="symbolPalette" class="symbol-palette" aria-label="候选图案选择栏"></div>
          </section>
        </section>
      </section>
    </section>

    <section class="support-strip">
      <button id="voiceBtn" type="button">语音引导：开</button>
      <button id="narrationBtn" type="button">播报模式：关键</button>
      <button id="parentModeBtn" type="button">护眼模式：标准</button>
    </section>

    <section class="result" id="result" hidden>
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
