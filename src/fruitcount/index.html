<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>水果计数乐 - 亲子小游戏</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <h1>水果计数乐</h1>
      <p>数一数屏幕上有几个水果，点出正确答案。</p>
      <div class="hero-links">
        <a href="../../index.html">返回首页</a> | <a href="../spell/index.html">字母拼读启蒙</a>
      </div>
    </header>

    <section class="play-stage">
      <section class="status-bar" aria-live="polite">
        <div><span class="label">分数</span><strong id="scoreValue">0</strong></div>
        <div><span class="label">连对</span><strong id="streakValue">0</strong></div>
        <div><span class="label">最佳连对</span><strong id="bestStreakValue">0</strong></div>
        <div><span class="label">关卡</span><strong id="levelValue">1</strong></div>
        <div><span class="label">已答</span><strong id="answeredValue">0</strong></div>
      </section>

      <section class="fruit-stage">
        <div id="fruitDisplay" class="fruit-display" aria-label="水果展示区" aria-live="polite"></div>
        <p id="fruitLabel" class="fruit-label"></p>
      </section>

      <section class="answer-panel">
        <p id="questionText" class="question-text">有几个水果？</p>
        <div id="choiceButtons" class="choice-buttons" aria-label="答题选项"></div>
        <button id="nextBtn" type="button" class="next-btn" hidden>下一题</button>
      </section>

      <section class="feedback-bar" aria-live="polite">
        <p id="feedback"></p>
      </section>
    </section>

    <section class="support-strip">
      <button id="resetBtn" type="button">重新开始</button>
      <button id="voiceBtn" type="button">语音引导：开</button>
      <button id="parentModeBtn" type="button">护眼模式：标准</button>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
