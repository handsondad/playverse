<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>滴答认时钟 - 儿童小游戏</title>
  <link rel="stylesheet" href="../shared/base.css" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" href="../../icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="../../icons/icon-192.png" />
  <link rel="manifest" href="../../manifest.webmanifest" />
  <meta name="theme-color" content="#66a2df" />
  <script type="module" src="../../src/shared/pwa.js"></script>
</head>
<body>
  <main class="clock-shell">
    <header class="hero">
      <h1>滴答认时钟</h1>
      <p id="guideText" role="status">看清圆盘上的短时针和长分针，选出正确的时间。</p>
      <div class="hero-links">
        <a href="../../index.html">返回首页</a> | <a href="../weatherwear/index.html">天气穿搭屋</a>
      </div>
    </header>

    <section class="play-stage">
      <section class="selector-panel">
        <strong>认钟难度</strong>
        <div id="levelButtons" class="level-buttons"></div>

        <strong class="action-title">开始操作</strong>
        <div class="selector-actions">
          <button id="startBtn" type="button">开始认钟</button>
          <button id="retryBtn" type="button">重新开始</button>
          <button id="dailyBtn" type="button">今日时钟</button>
        </div>
        <p id="selectorHint">建议从整点入门开始，熟悉短时针和长分针。</p>
      </section>

      <section class="game-panel">
        <div class="stats">
          <div><span>进度</span><strong id="progressValue">0 / 0</strong></div>
          <div><span>分数</span><strong id="scoreValue">0</strong></div>
          <div><span>连对</span><strong id="streakValue">0</strong></div>
          <div><span>提示</span><strong id="hintsValue">0</strong></div>
          <div><span>最佳</span><strong id="bestValue">0</strong></div>
        </div>

        <section class="clock-stage">
          <div class="clock-head">
            <span id="routineBadge" class="routine-badge">🕒 准备出发</span>
            <button id="hintBtn" type="button">刻度提示</button>
          </div>
          <p id="feedbackText" role="status">选好难度，点开始认时钟吧。</p>

          <div class="clock-layout">
            <div class="clock-face-wrap">
              <div id="clockFace" class="clock-face" aria-label="指针时钟表盘"></div>
              <div class="hand-legend">
                <span><i class="dot hour"></i>橙色短针：时针</span>
                <span><i class="dot minute"></i>蓝色长针：分针</span>
              </div>
            </div>

            <div class="choices-wrap">
              <strong>现在是几点钟？</strong>
              <div id="choiceButtons" class="choice-buttons" aria-label="时间答案选项区"></div>
            </div>
          </div>
        </section>
      </section>
    </section>

    <section class="support-strip">
      <button id="voiceBtn" type="button">语音引导：开</button>
      <button id="narrationBtn" type="button">播报模式：关键</button>
      <button id="parentModeBtn" type="button">护眼模式：标准</button>
    </section>

    <section class="result" id="result" hidden>
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
